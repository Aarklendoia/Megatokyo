# Example nginx site config for megatokyo-pwa.
#
# This serves ONLY the static app shell — it does not proxy the daemon's
# HTTP API. The app is a single-screen signal-driven SPA (no client-side
# routing, see pwa/src/main.rs), and it talks to megatokyo-daemon directly
# using a base URL + token entered in its own Settings screen, not via this
# nginx instance — so there is nothing to reverse-proxy here. If the daemon
# is served over plain HTTP while this site is HTTPS, browsers will block
# that as mixed content: put the daemon behind HTTPS too (or behind its own
# reverse proxy) rather than trying to tunnel it through this config.
#
# Install as /etc/nginx/sites-available/megatokyo-pwa, then:
#   ln -s /etc/nginx/sites-available/megatokyo-pwa /etc/nginx/sites-enabled/
#   systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name megatokyo.example.com;

    root /usr/share/megatokyo-pwa/www;
    index index.html;

    # The wasm-bindgen-generated binary; most nginx builds already map
    # .wasm to this via mime.types, but not every distro's does.
    types {
        application/wasm wasm;
    }

    # sw.js controls the whole origin (scope "/", see public/sw.js) and
    # must be revalidated on every load — a cached stale copy is exactly
    # the bug #84 fixed on the app side; don't reintroduce it here.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri =404;
    }
}
